name: Release
# Bei jedem Push auf main: Steht im Plugin eine Versionsnummer, zu der es noch kein Release gibt,
# baut dieser Ablauf die Zip, legt Tag vX.Y.Z und Release mit Zip und Prüfsumme an.
# Die WordPress-Seite (Plugin VLJ Claude Redaktion) findet das Release und aktualisiert sich selbst.
on:
  push:
    branches: [main]
    paths: ['vlj-claude-redaktion/**', '.github/workflows/release.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version lesen und prüfen
        run: |
          KOPF=$(grep -m1 -oP '^\s*\*\s*Version:\s*\K[0-9.]+' vlj-claude-redaktion/vlj-claude-redaktion.php)
          KONST=$(grep -m1 -oP "define\( 'VLJCR_VERSION', '\K[0-9.]+" vlj-claude-redaktion/vlj-claude-redaktion.php)
          echo "Kopf $KOPF, Konstante $KONST"
          test -n "$KOPF" && test "$KOPF" = "$KONST"
          php -l vlj-claude-redaktion/vlj-claude-redaktion.php
          echo "V=$KOPF" >> "$GITHUB_ENV"
      - name: Gibt es das Release schon?
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v$V" >/dev/null 2>&1; then echo "NEU=nein" >> "$GITHUB_ENV"; echo "v$V existiert bereits, nichts zu tun."; else echo "NEU=ja" >> "$GITHUB_ENV"; fi
      - name: Zip bauen und Release anlegen
        if: env.NEU == 'ja'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ZIP="vlj-claude-redaktion-$V.zip"
          zip -qr "$ZIP" vlj-claude-redaktion
          SHA=$(sha256sum "$ZIP" | cut -d' ' -f1)
          printf 'Version %s\n\nsha256: %s\n' "$V" "$SHA" > notes.md
          gh release create "v$V" "$ZIP" --target "$GITHUB_SHA" --title "v$V" --notes-file notes.md
